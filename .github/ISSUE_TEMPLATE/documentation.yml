name: Documentation
description: Report missing, incorrect, or unclear documentation
title: ""
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Link to or name the affected page.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, incorrect, or unclear?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested change
      description: Describe the correction or addition.
