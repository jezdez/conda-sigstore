name: Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tests.yml"
      - "pixi.lock"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tests.yml"
      - "pixi.lock"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.76.1
          environments: dev
          cache: true
      - name: Run static checks
        run: pixi run --locked -e dev check

  tests:
    name: ${{ matrix.os }}, Python 3.${{ matrix.python-minor }}
    runs-on: ${{ matrix.os }}
    env:
      PIXI_ENVIRONMENT: test-py3${{ matrix.python-minor }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-minor: ["10", "11", "12", "13", "14"]
        exclude:
          - os: ubuntu-latest
            python-minor: "13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.76.1
          environments: test-py3${{ matrix.python-minor }}
          cache: true
      - name: Run tests
        shell: bash
        run: pixi run --locked -e "$PIXI_ENVIRONMENT" test

  coverage:
    name: ubuntu-latest, Python 3.13
    runs-on: ubuntu-latest
    environment: codecov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.76.1
          environments: test-py313
          cache: true
      - name: Run tests with coverage
        run: pixi run --locked -e test-py313 test-cov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage.xml
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          token: ${{ env.CODECOV_TOKEN }}
